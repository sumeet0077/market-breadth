name: Daily Data Update

on:
  schedule:
    # Run every 20 minutes on non-congested minutes (:12, :32, :52)
    # between 11:00 UTC (16:30 IST) and 16:30 UTC (22:00 IST) Monday to Friday.
    # Non-round minutes prevent GitHub schedule queue starvation during peak hours.
    - cron: '12,32,52 11-16 * * 1-5'
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache Raw Data
        uses: actions/cache@v4
        with:
          path: data/raw_bhavcopies
          key: ${{ runner.os }}-raw-data-${{ hashFiles('scripts/fetch_data.py') }}
          restore-keys: |
            ${{ runner.os }}-raw-data-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Run Data Pipeline
        env:
          LOOKBACK_DAYS: 30
        run: |
          # 1. Fetch Data (Incremental)
          python scripts/fetch_data.py
          
          # 2. Ingest to DuckDB/Parquet (Updates Master Copy)
          python scripts/ingest_daily.py
          
          # 3. Calculate Metrics (Reads from Master Copy)
          python scripts/calculate_metrics.py
          
          # 4. Train Regime Model & Generate Bullseye Signals (Reads from JSON)
          python scripts/train_regime_model.py
          
          # 5. Train ML Swing Follow-Through Model
          python scripts/train_swing_model.py
          
          # 6. Enrich Sector Themes, Breakout Setups & Drilldowns
          python scripts/enrich_sector_setups.py
          
          # 7. Run Automated Pre-Commit Data Validation Guardrail
          python scripts/validate_pipeline_data.py
          
          # 8. Move JSON to Web Public folder (Crucial for Next.js)
          cp data/market_breadth.json web/public/market_breadth.json

      - name: Verify Next.js Production Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Check if there are changes
          if [[ -z $(git status -s) ]]; then
            echo "✅ No changes to commit. Data is already up-to-date."
            exit 0
          fi
          
          git add data/ web/public/
          git commit -m "📈 Auto-update: Market Breadth Data [skip ci]"
          
          # Robust Push with Merge-based Conflict Resolution
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            
            # Try pushing directly
            if git push; then
              echo "✅ Push successful!"
              exit 0
            fi
            
            # Push was rejected — remote has new commits
            # Pull with merge (not rebase), auto-resolve conflicts in our favour
            echo "⚠️ Push rejected. Merging remote changes (our data takes priority)..."
            git pull origin main --no-rebase -X ours --no-edit
            
            # Try pushing the merge commit
            if git push; then
              echo "✅ Push successful after merge!"
              exit 0
            fi
            
            echo "Push failed. Retrying in 5 seconds..."
            sleep 5
          done
          
          echo "❌ Failed to push after $MAX_RETRIES attempts."
          exit 1

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Pipeline Failed: ${new Date().toISOString().split('T')[0]}`;
            
            // Check for existing issue to avoid duplicates on the same day
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure'
            });
            
            if (existing.data.some(i => i.title === title)) {
              console.log('Issue already exists for today, skipping duplicate.');
              return;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: [
                '## Daily Data Pipeline Failed',
                '',
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Triggered at:** ${new Date().toISOString()}`,
                '',
                'Please investigate the failed run logs above.',
              ].join('\n'),
              labels: ['pipeline-failure']
            });
